name: Publish APT repo

# A push to main that touches a package reference, a committed binary or the
# repository config rebuilds the whole repo from packages/*.json + debs/ and
# publishes it to GitHub Pages, through the gh-action-debian-repo engine. This is
# a publish-only call: this repository is the collection its tools push their
# references to (conf/owners.conf says which tool may publish which package).
# The full set is reconstructed every run, so no app can clobber another's
# package.
#
# Signing uses the APT_SIGNING_KEY repository secret, passed to the engine by
# name. The engine lives under another account (andresbott), and across accounts
# GitHub ignores `secrets: inherit` and does not hand a github-pages environment
# secret to the engine's job either — the key must be a repository secret here.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'debs/**'
      - 'conf/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: andresbott/gh-action-debian-repo/.github/workflows/publish.yml@v1
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
