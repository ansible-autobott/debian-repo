// Release-file settings for the autobott static APT repository.
// Consumed by `apt-ftparchive -c conf/apt-ftparchive.conf release dists/stable`
// (see the `build` target in the Makefile). The per-architecture Packages
// files are generated with `apt-ftparchive --arch <arch> packages pool/main`.

APT::FTPArchive::Release {
    Origin        "autobott";
    Label         "autobott";
    Suite         "stable";
    Codename      "stable";
    Components    "main";
    Architectures "amd64 arm64";
    Description   "autobott Debian repository";
};
