# Landing-page configuration for the generated index.html.
#
# Sourced by scripts/gen-index.sh at build time (make build / make publish) and
# substituted into index.html. Shell syntax: KEY="value", no spaces around '='.
# These are the only repo-specific strings on the page — change them here, not
# in index.html. (The apt config in autobott.sources is a separate file.)

# Repository identity (title/wordmark + tagline).
SITE_TITLE="autobott"
SITE_TAGLINE="A signed APT repository for Debian and Ubuntu"

# Base URL the repository is published at, and the GitHub project link.
REPO_URL="https://ansible-autobott.github.io/debian-repo"
GITHUB_URL="https://github.com/ansible-autobott/debian-repo"

# Filenames served at REPO_URL and referenced by the install instructions.
KEYRING_FILE="autobott-archive-keyring.gpg"
SOURCES_FILE="autobott.sources"

# Colour theme. 'violet' is built in; alternates live in conf/themes/<name>.css
# (currently: teal, blue, amber, rose). Override per build with: make build THEME=teal
THEME="teal"
